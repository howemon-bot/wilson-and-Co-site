name: Deploy to SiteGround

# Every push to main uploads the built site to SiteGround (folder in SG_PATH).
# Until the SG_* secrets are added, the upload step is skipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          include-hidden-files: true  # keeps .htaccess

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check SiteGround secrets
        id: ready
        env:
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PATH: ${{ secrets.SG_PATH }}
        run: |
          if [ -n "$SG_SSH_KEY" ] && [ -n "$SG_HOST" ] && [ -n "$SG_PORT" ] && [ -n "$SG_USER" ] && [ -n "$SG_PATH" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SiteGround secrets not set yet; skipping upload."
          fi

      - uses: actions/download-artifact@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          name: dist
          path: dist

      - name: Set up SSH
        if: steps.ready.outputs.ok == 'true'
        env:
          SG_SSH_KEY: ${{ secrets.SG_SSH_KEY }}
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SG_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SG_PORT" "$SG_HOST" >> ~/.ssh/known_hosts

      # If the folder still holds WordPress, move it aside (next to the folder,
      # not public) instead of letting rsync delete it. Runs only once.
      - name: Keep old WordPress files
        if: steps.ready.outputs.ok == 'true'
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PATH: ${{ secrets.SG_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SG_PORT" "$SG_USER@$SG_HOST" bash -s -- "$SG_PATH" <<'EOF'
          set -e
          d="$1"
          if [ -f "$d/wp-config.php" ]; then
            b="$d.wordpress-backup-$(date +%Y%m%d-%H%M)"
            mv "$d" "$b"
            mkdir "$d"
            if [ -d "$b/.well-known" ]; then cp -a "$b/.well-known" "$d/"; fi
            echo "WordPress moved to $b"
          else
            echo "No WordPress here; nothing to move."
          fi
          EOF

      - name: Upload with rsync
        if: steps.ready.outputs.ok == 'true'
        env:
          SG_HOST: ${{ secrets.SG_HOST }}
          SG_PORT: ${{ secrets.SG_PORT }}
          SG_USER: ${{ secrets.SG_USER }}
          SG_PATH: ${{ secrets.SG_PATH }}
        run: |
          rsync -avz --delete \
            --exclude='.well-known' --exclude='cgi-bin' \
            -e "ssh -i ~/.ssh/deploy_key -p $SG_PORT" \
            dist/ "$SG_USER@$SG_HOST:$SG_PATH/"
